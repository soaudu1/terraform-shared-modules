name: Provision via Terraform

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: true
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/sandbox

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::920864529120:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init & Plan
        run: |
          cd $TF_WORKING_DIR
          terraform init
          terraform validate
          terraform plan -no-color -out=tfplan

  apply:
    runs-on: ubuntu-latest
    needs: plan
    continue-on-error: true  # ← So we can handle failure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::920864529120:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Apply
        id: tf-apply
        run: |
          cd $TF_WORKING_DIR
          terraform init
          terraform apply -auto-approve tfplan

  destroy-on-failure:
    runs-on: ubuntu-latest
    needs: apply
    if: failure() && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::920864529120:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Destroy (Auto-triggered on Failure)
        run: |
          cd $TF_WORKING_DIR
          terraform init
          terraform destroy -auto-approve
