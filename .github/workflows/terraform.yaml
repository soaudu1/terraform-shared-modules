name: Terraform Provision Sandbox

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  TF_IN_AUTOMATION: true
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/sandbox

jobs:
  terraform:
    name: Terraform Plan, Apply, Destroy on Failure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::920864529120:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          cd $TF_WORKING_DIR
          terraform init

      - name: Terraform Plan
        id: tfplan
        run: |
          cd $TF_WORKING_DIR
          terraform validate
          terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        id: tfapply
        run: |
          cd $TF_WORKING_DIR
          terraform apply -auto-approve tfplan
        continue-on-error: true

      - name: Terraform Destroy on Failure
        if: steps.tfapply.outcome == 'failure'
        run: |
          echo "Terraform apply failed — destroying resources..."
          cd $TF_WORKING_DIR
          terraform destroy -auto-approve
