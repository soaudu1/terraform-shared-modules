name: Provision via Terraform

on:
  push:
    branches: 
    - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      
      - name: Dump GitHub context
        uses: actions/github-script@v7
        with:
          script: |
            console.log("REPO:", context.repo.owner + "/" + context.repo.repo)
            console.log("BRANCH:", context.ref)      
 
      - name: CConfigure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::920864529120:role/github-actions-role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Plan
        run: |
          cd infra/sandbox
          terraform init
          terraform fmt -check
          terraform validate
          terraform plan

